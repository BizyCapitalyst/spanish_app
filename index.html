<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spanish" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Spanish Trainer</title>
<style>
  :root {
    --bg:           #0a0a0d;
    --bg-elevated:  #14141a;
    --bg-card:      #16161d;
    --bg-tile:      #1c1c25;
    --bg-input:     #1f1f29;
    --bg-hover:     #23232f;
    --border:       #26262f;
    --border-soft:  #1e1e26;
    --text:         #ededf0;
    --text-mid:     #a8a8b3;
    --text-dim:     #6a6a76;
    --accent:       #fbbf24;
    --accent-hi:    #fcd34d;
    --accent-soft:  rgba(251, 191, 36, 0.12);
    --accent-glow:  rgba(251, 191, 36, 0.25);
    /* Orange palette — used for the top nav menu, tile tense labels,
       and the chosen Spanish verb. --orange-muted is the same hue as
       --orange (#fb923c) but with saturation pulled down (~95% → 65%)
       so it's softer, not a different shade. */
    --orange:       #fb923c;
    --orange-hi:    #fdba74;
    --orange-muted: #dc9466;
    --orange-soft:  rgba(251, 146, 60, 0.13);
    --orange-deep:  #c2410c;
    --blue:         #60a5fa;
    --blue-soft:    rgba(96, 165, 250, 0.13);
    --blue-glow:    rgba(96, 165, 250, 0.28);
    --good:         #34d399;
    --bad:          #f87171;
    --radius:       14px;
    --radius-sm:    10px;
    --shadow-card:  0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: contain;
  }
  body::before {
    content: "";
    position: fixed;
    top: -200px; left: 50%;
    width: 600px; height: 400px;
    background: radial-gradient(ellipse at center, rgba(251,191,36,0.06), transparent 65%);
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 0;
  }
  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 14px 80px;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 18px;
  }
  header .title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .logo {
    width: 38px; height: 38px;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 4px 14px -4px var(--accent-glow);
    flex-shrink: 0;
  }
  header .logo svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header .sub {
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 1px;
  }

  /* NAV */
  nav {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: var(--bg-elevated);
    padding: 4px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
  }
  nav button {
    flex: 1;
    background: transparent;
    color: var(--orange-hi);
    border: none;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: all 0.15s;
    opacity: 0.55;
  }
  nav button.active {
    background: var(--bg-card);
    color: var(--orange);
    opacity: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  nav button:disabled { opacity: 0.35; cursor: not-allowed; }

  /* CARD */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-card);
  }
  .card-collapsible > .card-header {
    cursor: pointer;
    user-select: none;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .card-actions {
    display: flex;
    gap: 6px;
  }
  .chip-btn {
    background: var(--bg-tile);
    color: var(--text-mid);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    font-weight: 500;
    transition: all 0.15s;
  }
  .chip-btn:hover, .chip-btn:active {
    background: var(--bg-hover);
    color: var(--text);
  }
  .caret {
    width: 16px; height: 16px;
    color: var(--text-dim);
    transition: transform 0.2s;
  }
  .card-collapsible.collapsed .caret { transform: rotate(-90deg); }
  .card-collapsible.collapsed .card-body { display: none; }

  /* MOOD GROUPS */
  .mood-group { margin-bottom: 10px; }
  .mood-group:last-child { margin-bottom: 0; }
  .mood-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 8px;
    padding: 6px 8px;
    background: var(--bg-tile);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .mood-header:hover, .mood-header:active { background: var(--bg-hover); }
  .mood-header .caret {
    width: 12px; height: 12px;
    color: var(--text-dim);
    transition: transform 0.2s;
  }
  .mood-group.collapsed .caret { transform: rotate(-90deg); }
  .mood-group.collapsed .toggles { display: none; }
  .mood-header .name { flex: 1; }
  .mood-header .count {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    background: var(--bg-card);
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
  }
  .mood-header .count.has-active {
    color: var(--accent);
    border-color: rgba(251,191,36,0.3);
  }
  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 10px;
    background: var(--bg-tile);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
    color: var(--text-mid);
    min-height: 32px;
    line-height: 1.25;
  }
  .toggle .text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
  }
  .toggle:active { transform: scale(0.97); }
  .toggle.on {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .toggle .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .toggle.on .dot {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }
  .toggle .ex {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 10px;
    font-style: italic;
  }
  .toggle.on .ex {
    color: var(--accent);
    opacity: 0.65;
  }

  /* Pronoun filter — 2-column grid mimicking Spanish conjugation layout
     left (singular): yo / tú / él · right (plural): nosotros / vosotros placeholder / ellos */
  #pronounToggles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  #pronounToggles .toggle {
    justify-content: flex-start;
    border-radius: 10px;
  }
  #pronounToggles .toggle.placeholder {
    opacity: 0.35;
    pointer-events: none;
    border-style: dashed;
    background: transparent;
  }
  #pronounToggles .toggle.placeholder .label {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  /* Active pronoun toggles use blue (vs the yellow accent of tense toggles) */
  #pronounToggles .toggle.on {
    background: var(--blue-soft);
    border-color: var(--blue);
    color: var(--blue);
  }
  #pronounToggles .toggle.on .dot {
    background: var(--blue);
    box-shadow: 0 0 6px var(--blue-glow);
  }

  /* INPUT */
  .input-wrap {
    position: relative;
  }
  .verb-input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .verb-input::placeholder { color: var(--text-dim); }
  .verb-input {
    padding-left: 80px;   /* room for left-side EN/ES toggle */
    padding-right: 92px;  /* room for mic + clear on right */
    position: relative;
    z-index: 0;
  }
  .verb-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .input-btns {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 4px;
    align-items: center;
    z-index: 2;
  }
  .input-btns button {
    background: var(--bg-tile);
    border: 1px solid var(--border);
    color: var(--text-dim);
    height: 32px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    font-family: inherit;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .input-btns button:active { transform: scale(0.95); }
  .lang-btn {
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-tile);
    border: 1px solid var(--border);
    color: var(--text-mid);
    height: 36px;
    width: 62px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    z-index: 2;
  }
  .lang-btn:active { transform: translateY(-50%) scale(0.96); }
  .lang-btn[data-lang="en"] {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(251,191,36,0.38);
  }
  .lang-btn[data-lang="es"] {
    background: var(--orange-soft);
    color: var(--orange);
    border-color: rgba(251,146,60,0.38);
  }
  .mic-btn {
    width: 32px;
    padding: 0 !important;
  }
  .mic-btn.recording {
    background: var(--bad);
    color: white;
    border-color: var(--bad);
    animation: pulse 1s infinite;
  }
  .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); }
    50%     { box-shadow: 0 0 0 6px rgba(248,113,113,0); }
  }
  .clear-btn {
    background: var(--bg-tile);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .clear-btn.visible { display: flex; }

  /* RESULT */
  .verb-result {
    color: var(--text-mid);
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }
  .verb-result strong {
    color: var(--blue);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .verb-result .pill {
    display: inline-block;
    background: var(--bg-tile);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 10px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 500;
  }
  .verb-result.warn { color: var(--bad); font-size: 13px; }

  /* SUGGESTIONS */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }
  .suggestions .label {
    font-size: 11px;
    color: var(--text-dim);
    align-self: center;
    margin-right: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* TILES */
  .tiles {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .verb-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 16px;
    background: linear-gradient(180deg, var(--bg-card), var(--bg-tile));
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
  }
  .verb-header .es {
    font-size: 20px;
    font-weight: 600;
    color: var(--blue);
    letter-spacing: -0.01em;
  }
  .verb-header .pp {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .verb-header .pp em {
    color: var(--text-mid);
    font-style: normal;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
  }
  .verb-header .pp-en {
    margin-left: 6px;
    color: var(--text-dim);
    font-style: italic;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }
  .tile {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-card);
  }
  .tile-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .tile-head .label {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.005em;
  }
  .tile-head .es-name {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .tile-example {
    text-align: left;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .row {
    display: grid;
    grid-template-columns: 38% 1fr;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-soft);
    align-items: baseline;
  }
  .row:last-child { border-bottom: none; }
  .row .pron {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
  }
  .row .form-cell {
    /* Container for Spanish form (top) + English equivalent (bottom).
       Both children align right against the row's right edge. */
    min-width: 0;
  }
  .row .es-form {
    text-align: right;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.005em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .row .es-form:active { opacity: 0.6; }
  .verb-header .es { cursor: pointer; }
  .verb-header .es:active { opacity: 0.7; }
  .verb-header .play-hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 6px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .row .en-form {
    text-align: right;
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    letter-spacing: 0;
  }
  .es-form .stem      { color: var(--blue); }
  .es-form .dash      { display: none; }
  .es-form .ending    { color: var(--orange); font-weight: 600; }
  .es-form .participle{ color: var(--blue); margin-left: 4px; font-weight: 500; }
  .es-form .reflexive-pron { color: var(--text-mid); font-weight: 500; }
  .es-form .negation       { color: var(--text-dim); }

  /* EMPTY */
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 10px;
    padding: 24px 0 8px;
    letter-spacing: 0.02em;
  }
  /* Update chip in the header — shows the running version, becomes a
     prominent green pill when a newer version.json is detected. */
  .update-chip {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--text-dim);
    background: var(--bg-tile);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .update-chip:active { opacity: 0.7; }
  .update-chip.has-update {
    background: rgba(52, 211, 153, 0.13);
    color: var(--good);
    border-color: var(--good);
    letter-spacing: 0;
    animation: chip-pulse 1.6s ease-in-out infinite;
  }
  @keyframes chip-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    50%      { box-shadow: 0 0 0 5px rgba(52, 211, 153, 0.18); }
  }
  /* Version footer with the manual "Check for updates" button. */
  .version-footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .check-btn {
    background: var(--bg-tile);
    border: 1px solid var(--border);
    color: var(--text-mid);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.02em;
    transition: all 0.15s;
  }
  .check-btn:hover, .check-btn:active {
    color: var(--text);
    border-color: var(--text-dim);
  }

  /* DESKTOP TWEAKS */
  @media (min-width: 600px) {
    .app { padding-top: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <div class="logo" aria-label="Spanish Trainer">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <rect width="512" height="512" fill="#fbbf24"/>
          <g stroke="#1a1004" stroke-width="14" fill="none">
            <line x1="256" y1="60"  x2="256" y2="452"/>
            <line x1="60"  y1="190" x2="452" y2="190"/>
            <line x1="60"  y1="322" x2="452" y2="322"/>
          </g>
          <g fill="#1a1004" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="80" text-anchor="middle">
            <text x="158" y="148">yo</text>
            <text x="158" y="280">tú</text>
            <text x="158" y="412">él</text>
            <text x="354" y="148">-o</text>
            <text x="354" y="280">-as</text>
            <text x="354" y="412">-a</text>
          </g>
        </svg>
      </div>
      <div>
        <h1>Spanish Trainer</h1>
        <div class="sub">Verb conjugation · vosotros excluded</div>
      </div>
    </div>
    <span class="update-chip" id="updateChip" title="Tap to check for updates">v…</span>
  </header>

  <nav>
    <button class="active">Conjugation</button>
    <button disabled title="Coming soon">Vocabulary</button>
    <button disabled title="Coming soon">Testing</button>
  </nav>

  <div class="card card-collapsible" id="togglesCard">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg class="caret" viewBox="0 0 16 16" fill="currentColor"><path d="M4 6l4 4 4-4z"/></svg>
        <span class="card-title">Tense toggles</span>
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="chip-btn" id="toggleAllOn">All</button>
        <button class="chip-btn" id="toggleAllOff">None</button>
        <button class="chip-btn" id="presetCore">Core 4</button>
      </div>
    </div>
    <div class="card-body" id="moodGroups"></div>
  </div>

  <div class="card card-collapsible" id="pronounsCard">

  present:              (f, i) => `${EN_SUBJ[i]} ${presentEnForm(f, i)}`,
  preterite:            (f, i) => f.past === 'was' ? `${EN_SUBJ[i]} ${EN_BE_PAST[i]}` : `${EN_SUBJ[i]} ${f.past}`,
  imperfect:            (f, i) => f.pres === 'am'  ? `${EN_SUBJ[i]} ${EN_BE_PAST[i]}` : `${EN_SUBJ[i]} ${EN_BE_PAST[i]} ${f.ing}`,
  future:               (f, i) => `${EN_SUBJ[i]} will ${f.base}`,
  conditional:          (f, i) => `${EN_SUBJ[i]} would ${f.base}`,
  present_perfect:      (f, i) => `${EN_SUBJ[i]} ${EN_HAVE_PRES[i]} ${f.pp}`,
  pluperfect:           (f, i) => `${EN_SUBJ[i]} had ${f.pp}`,
  future_perfect:       (f, i) => `${EN_SUBJ[i]} will have ${f.pp}`,
  conditional_perfect:  (f, i) => `${EN_SUBJ[i]} would have ${f.pp}`,
  present_subj:         (f, i) => `(that) ${EN_SUBJ[i]} ${f.base}`,
  imperfect_subj:       (f, i) => f.past === 'was' ? `(that) ${EN_SUBJ[i]} were` : `(that) ${EN_SUBJ[i]} ${f.past}`,
  present_perfect_subj: (f, i) => `(that) ${EN_SUBJ[i]} ${EN_HAVE_PRES[i]} ${f.pp}`,
  pluperfect_subj:      (f, i) => `(that) ${EN_SUBJ[i]} had ${f.pp}`,

  } else if (rest[0] === 'would' && rest[1] === 'have' && rest.length === 3) {
    tense = 'conditional_perfect'; baseVerb = findBaseFromPP(rest[2]);
  } else if (rest[0] === 'will' && rest.length === 2) {
    tense = 'future';              baseVerb = findBaseFromBase(rest[1]);
  } else if (rest[0] === 'would' && rest.length === 2) {
    tense = 'conditional';         baseVerb = findBaseFromBase(rest[1]);
  } else if ((rest[0] === 'have' || rest[0] === 'has') && rest.length === 2) {
    tense = 'present_perfect';     baseVerb = findBaseFromPP(rest[1]);
  } else if (rest[0] === 'had' && rest.length === 2) {
    tense = 'pluperfect';          baseVerb = findBaseFromPP(rest[1]);

// FORM SPLITTING — for stem-ending dash styling

  if (!voices.length) return null;
  // Preference order: es-ES, es-MX, es-US, es-419, any es-*
  const preferred = ['es-ES','es-MX','es-US','es-419','es-AR','es-CO','es-CL'];
  for (const code of preferred) {

function regularImperfectSubj(stem, ending) {
  if (ending === 'ar') return [stem+'ara', stem+'aras', stem+'ara', stem+'áramos', stem+'aran'];
  return [stem+'iera', stem+'ieras', stem+'iera', stem+'iéramos', stem+'ieran'];
}
function regularParticiple(infinitive) {
  const ending = getEnding(infinitive);
  const stem = getStem(infinitive);
  return ending === 'ar' ? stem+'ado' : stem+'ido';
}
function regularImperativeAff(stem, ending, presSubj) {
  const tu = ending === 'ar' ? stem+'a' : stem+'e';
  return [tu, presSubj[2], presSubj[3], presSubj[4]];
}
function imperativeNeg(presSubj) {
  return ['no '+presSubj[1], 'no '+presSubj[2], 'no '+presSubj[3], 'no '+presSubj[4]];
}
function compound(haberForms, participle) {
  return haberForms.map(h => h + ' ' + participle);
}

// === Reflexive verb support =====================================
// Adds an accent on the originally-stressed vowel when needed (so the
// stress doesn't drift after a clitic pronoun is appended).
function addAccentIfNeeded(form) {
  if (!form || /[áéíóúÁÉÍÓÚ]/.test(form)) return form;
  const vowelGroups = form.match(/[aeiouAEIOU]+/g) || [];
  if (vowelGroups.length < 2) return form; // 1-syllable: no accent needed
  // Stress falls on penultimate vowel group for words ending in vowel/n/s
  // (the ones we get out of the imperative). After cliticisation that
  // syllable becomes antepenultimate or earlier — needs a written accent.
  const targetIdx = vowelGroups.length - 2;
  let count = 0, i = 0;
  while (i < form.length) {
    if (/[aeiouAEIOU]/.test(form[i])) {
      const start = i;
      while (i < form.length && /[aeiouAEIOU]/.test(form[i])) i++;
      if (count === targetIdx) {
        const grp = form.slice(start, i);
        // Prefer the strong vowel (a, e, o); fall back to last vowel.
        let pos = grp.length - 1;
        for (let k = 0; k < grp.length; k++) {
          if ('aeoAEO'.includes(grp[k])) { pos = k; break; }
        }
        const map = {a:'á',e:'é',i:'í',o:'ó',u:'ú',A:'Á',E:'É',I:'Í',O:'Ó',U:'Ú'};
        return form.slice(0, start + pos) + map[grp[pos]] + form.slice(start + pos + 1);
      }
      count++;
    } else { i++; }
  }
  return form;
}

// Attach a reflexive pronoun to an affirmative imperative form,
// adjusting accent and (for nosotros) dropping the final s.
function attachReflexive(form, idx) {
  if (!form || form === '—') return form;
  // idx: 0=tú, 1=Ud., 2=nosotros, 3=Uds.
  if (idx === 2) {
    const stripped = form.endsWith('s') ? form.slice(0, -1) : form;
    return addAccentIfNeeded(stripped) + 'nos';
  }
  const pron = ['te', 'se', null, 'se'][idx];
  return addAccentIfNeeded(form) + pron;
}

function conjugateReflexive(reflexiveInf) {
  const baseInf = reflexiveInf.slice(0, -2); // 'ducharse' → 'duchar'
  if (!getEnding(baseInf)) return null;
  const baseConj = conjugateNonReflexive(baseInf);
  if (!baseConj) return null;
  const pre = ['me', 'te', 'se', 'nos', 'se'];
  const result = { infinitive: reflexiveInf, participle: baseConj.participle };
  // Simple tenses + compound tenses: pronoun + space + verb form
  const PRONOUN_TENSES = [
    'present','preterite','imperfect','future','conditional',
    'present_subj','imperfect_subj',
    'present_perfect','pluperfect','future_perfect','conditional_perfect',
    'present_perfect_subj','pluperfect_subj'
  ];
  for (const t of PRONOUN_TENSES) {
    if (baseConj[t]) {
      result[t] = baseConj[t].map((f, i) => pre[i] + ' ' + f);
    }
  }
  // Imperative affirmative: pronouns ATTACH to the verb (with accent shift).
  result.imperative_aff = baseConj.imperative_aff.map((f, i) => attachReflexive(f, i));
  // Imperative negative: 'no [pron] [verb]' — pronoun goes between 'no' and verb.
  const impPron = ['te', 'se', 'nos', 'se'];
  result.imperative_neg = baseConj.imperative_neg.map((f, i) => {
    if (f && f.startsWith('no ')) return 'no ' + impPron[i] + ' ' + f.slice(3);
    return f;
  });
  return result;
}

function conjugate(infinitive) {
  if (infinitive && infinitive.endsWith('se') && infinitive.length > 4) {
    return conjugateReflexive(infinitive);
  }
  return conjugateNonReflexive(infinitive);
}

function conjugateNonReflexive(infinitive) {
  const ending = getEnding(infinitive);
  if (!ending) return null;
  const stem = getStem(infinitive);
  const irreg = IRREGULARS[infinitive] || {};

  const present     = irreg.present     || regularPresent(stem, ending);
  const preterite   = irreg.preterite   || regularPreterite(stem, ending);
  const imperfect   = irreg.imperfect   || regularImperfect(stem, ending);
  const future      = irreg.future      || (irreg.future_stem ? regularFuture(irreg.future_stem) : regularFuture(infinitive));
  const conditional = irreg.conditional || (irreg.future_stem ? regularConditional(irreg.future_stem) : regularConditional(infinitive));
  const present_subj   = irreg.present_subj   || regularPresentSubj(stem, ending);
  const imperfect_subj = irreg.imperfect_subj || regularImperfectSubj(stem, ending);

  const participle = irreg.participle || regularParticiple(infinitive);

  const present_perfect       = compound(HABER.present,        participle);
  const pluperfect            = compound(HABER.imperfect,      participle);
  const future_perfect        = compound(HABER.future,         participle);
  const conditional_perfect   = compound(HABER.conditional,    participle);
  const present_perfect_subj  = compound(HABER.present_subj,   participle);
  const pluperfect_subj       = compound(HABER.imperfect_subj, participle);

  const imperative_aff = irreg.imperative_aff || regularImperativeAff(stem, ending, present_subj);
  const imperative_neg = imperativeNeg(present_subj);

  return {
    infinitive, participle,
    present, preterite, imperfect, future, conditional,
    present_perfect, pluperfect, future_perfect, conditional_perfect,
    present_subj, imperfect_subj, present_perfect_subj, pluperfect_subj,
    imperative_aff, imperative_neg,
  };
}

// LOOKUP
//=================================================================
function normalizeEnglish(s) {
  return s.trim().toLowerCase().replace(/^to\s+/, '');
}

// Returns { type: 'en'|'es', enBase, infinitives } or null.
// 1. English dictionary key (e.g. "speak")
// 2. Known Spanish conjugated form (e.g. "hablo", "fui", "comemos")
// 3. Anything else ending in -ar/-er/-ir → treat as Spanish infinitive
function lookupVerb(input) {
  const key = normalizeEnglish(input);
  if (!key) return null;
  if (ENGLISH_TO_SPANISH[key]) {
    return { type: 'en', enBase: key, infinitives: ENGLISH_TO_SPANISH[key] };
  }
  // If the input is itself a known Spanish infinitive, use it directly.
  if (SPANISH_VERB_LIST.indexOf(key) !== -1) {
    return { type: 'es', enBase: currentEnglishBase, infinitives: [key] };
  }
  // Conjugated form → resolve to one or more infinitives.
  const formKey = FORM_TO_INFINITIVE[key] ? key : (FORM_TO_INFINITIVE[stripAccents(key)] ? stripAccents(key) : null);
  if (formKey) {
    return { type: 'es', enBase: currentEnglishBase, infinitives: FORM_TO_INFINITIVE[formKey].slice() };
  }
  // Fallback: any -ar/-er/-ir shape → treat as a fresh Spanish infinitive.
  if (getEnding(key)) {
    return { type: 'es', enBase: currentEnglishBase, infinitives: [key] };
  }
  return null;
}
// Flat list of unique Spanish verbs reachable through the dictionary.
// Used for ES-mode autocomplete + match chips.
const SPANISH_VERB_LIST = (() => {
  const set = new Set();
  for (const list of Object.values(ENGLISH_TO_SPANISH)) {
    for (const v of list) set.add(v);
  }
  return Array.from(set).sort();
})();

function stripAccents(s) {
  if (!s || !s.normalize) return s;
  // Strip combining diacritics (U+0300..U+036F)
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '');
}

// Build a reverse index: every conjugated single-word form → its infinitive(s).
// Lets users type a conjugated form like "hablo" or "fueron" and still get
// the base verb conjugated, while the typed form stays in the search bar.
const FORM_TO_INFINITIVE = (() => {
  const map = {};
  const SIMPLE_TENSES = ['present','preterite','imperfect','future','conditional','present_subj','imperfect_subj','imperative_aff'];
  for (const inf of SPANISH_VERB_LIST) {
    let conj = null;
    try { conj = conjugate(inf); } catch (e) { continue; }
    if (!conj) continue;
    for (const t of SIMPLE_TENSES) {
      const arr = conj[t];
      if (!arr) continue;
      for (const form of arr) {
        if (!form || form === '—') continue;
        // Index forms with spaces only when they're reflexive ("me ducho",
        // "te has duchado", etc.) so compound non-reflexive doesn't bloat the index.
        if (form.indexOf(' ') !== -1 && !/^(me|te|se|nos)\s/.test(form)) continue;
        const k = stripAccents(form);
        if (!map[k]) map[k] = [];
        if (!map[k].includes(inf)) map[k].push(inf);
        if (k !== form) {
          if (!map[form]) map[form] = [];
          if (!map[form].includes(inf)) map[form].push(inf);
        }
      }
    }
  }
  return map;
})();

// Returns true when the EN/ES toggle is in Spanish mode.
function isSpanishMode() {
  return typeof speechLang !== 'undefined' && speechLang === 'es-ES';
}

// Match-chip search: English keys (EN mode), or Spanish infinitives + base
// verbs of any matching conjugated form (ES mode).
function searchVerbs(query, limit = 10) {
  const qRaw = normalizeEnglish(query);
  if (!qRaw) return [];
  const q = stripAccents(qRaw);
  const out = [];
  const seen = new Set();
  const score = (k) => {
    const ka = stripAccents(k);
    return ka === q ? 3 : ka.startsWith(q) ? 2 : ka.includes(q) ? 1 : 0;
  };
  if (isSpanishMode()) {
    // 1. Direct infinitive matches (prefix/contains)
    for (const k of SPANISH_VERB_LIST) {
      const s = score(k);
      if (s > 0 && !seen.has(k)) {
        seen.add(k);
        out.push({ key: k, sub: IRREGULARS[k] ? 'irregular' : '', score: s });
      }
    }
    // 2. Conjugated-form matches → add their base verb(s)
    //    e.g. typing "hablo", "fui", "tuvo", "comemos" surfaces hablar / ser / ir / tener / comer
    for (const formKey of Object.keys(FORM_TO_INFINITIVE)) {
      const ka = stripAccents(formKey);
      let s = 0;
      if (ka === q)             s = 3;
      else if (ka.startsWith(q)) s = 2;
      if (s === 0) continue;
      for (const inf of FORM_TO_INFINITIVE[formKey]) {
        if (seen.has(inf)) continue;
        seen.add(inf);
        // Slight score penalty so direct infinitive hits rank above derived ones.
        out.push({ key: inf, sub: 'from "' + formKey + '"', score: s - 0.4 });
      }
      if (out.length >= limit * 2) break;
    }
  } else {
    for (const k of Object.keys(ENGLISH_TO_SPANISH)) {
      const s = score(k);
      if (s > 0) out.push({ key: k, sub: ENGLISH_TO_SPANISH[k].join(' · '), score: s });
    }
  }
  out.sort((a, b) => b.score - a.score || a.key.length - b.key.length);
  return out.slice(0, limit);
}

  const layout = [

    { idx: 1, label: PRONOUNS_5[1] },             // tú

    { idx: 2, label: PRONOUNS_5[2] },             // él / ella / Ud.
    { idx: 4, label: PRONOUNS_5[4] },             // ellos / ellas / Uds.
  ];
  layout.forEach(cell => {

      el.title = 'vosotros — excluded';

  });
}

// Default chips when the input is empty — separate lists per language mode.
// Both lists are filtered against the actual dictionary so removed entries
// won't produce dead chips.
const SUGGEST_DEFAULTS_EN = ['be','have','do','go','see','know','want','come','eat','speak'];
const SUGGEST_DEFAULTS_ES = ['ser','estar','tener','hacer','ir','decir','ver','dar','saber','querer'];

function renderSuggestions() {
  const c = document.getElementById('suggestions');
  const query = (inputEl && inputEl.value || '').trim();
  let samples;
  let label;
  if (query) {
    samples = searchVerbs(query, 10).map(it => it.key);
    label = samples.length ? 'Matches' : 'No match';
  } else if (isSpanishMode()) {
    samples = SUGGEST_DEFAULTS_ES.filter(v => SPANISH_VERB_LIST.includes(v));
    label = 'Try';
  } else {
    samples = SUGGEST_DEFAULTS_EN.filter(v => ENGLISH_TO_SPANISH[v]);
    label = 'Try';
  }
  c.innerHTML = '<span class="label">' + label + '</span>';
  samples.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip-btn';
    b.textContent = s;
    // Android Chrome's keyboard is stubborn — it ignores plain .blur() and
    // even readonly alone in some builds. We layer four techniques:
    //   1. VirtualKeyboard API (Chrome 94+, the standards-track way)
    //   2. inputmode="none" (declarative "no keyboard, please")
    //   3. readonly attribute (input becomes non-editable)
    //   4. .blur() (drop focus)
    // At least one of these triggers the keyboard manager to dismiss on
    // every Android Chrome we've tested. All four are reverted ~250ms
    // later so the next time the user taps the input, the keyboard
    // re-opens normally.
    const fireDismiss = () => {
      _chipTapInProgress = true;
      try {
        if (navigator.virtualKeyboard && navigator.virtualKeyboard.hide) {
          navigator.virtualKeyboard.hide();
        }
      } catch (e) {}
      if (document.activeElement === inputEl) {
        inputEl.setAttribute('inputmode', 'none');
        inputEl.setAttribute('readonly', 'readonly');
        inputEl.blur();
      }
    };
    // pointerdown covers mouse + most touch; touchstart is a backstop
    // for older Android Chromium that fires touchstart slightly differently.
    b.addEventListener('pointerdown', fireDismiss);
    b.addEventListener('touchstart', fireDismiss, { passive: true });
    b.addEventListener('click', () => {
      inputEl.value = s;
      clearBtn.classList.add('visible');
      hideAutocomplete();
      handleConjugate(s);
      renderSuggestions();
      setTimeout(() => {
        inputEl.removeAttribute('readonly');
        inputEl.removeAttribute('inputmode');
        _chipTapInProgress = false;
      }, 250);
    });
    c.appendChild(b);
  });
}

function renderTiles() {
  const tilesEl = document.getElementById('tiles');
  const empty = document.getElementById('emptyState');
  tilesEl.innerHTML = '';

  // When a filter is active (English-pair input), restrict tiles to the
  // single matching tense; otherwise honor the user's tense toggles.
  const active = conjugateFilter
    ? TENSES.filter(t => t.key === conjugateFilter.tense)
    : TENSES.filter(t => toggles[t.key]);

  if (currentConjugations.length === 0) {
    empty.style.display = 'block';
    empty.textContent = 'Enter an English verb above to see conjugation tiles.';
    return;
  }
  if (active.length === 0) {
    empty.style.display = 'block';
    empty.textContent = 'No tenses selected. Toggle some on above.';
    return;
  }
  empty.style.display = 'none';

  for (const conj of currentConjugations) {
    const header = document.createElement('div');
    header.className = 'verb-header';
    const enForms = getEnForms(currentEnglishBase) || getEnForms('be');
    header.innerHTML =
      '<div class="es" title="Tap to hear">' + conj.conjugations.infinitive +
      '<span class="play-hint">🔊</span></div>' +
      '<div class="pp">past part. <em>' + conj.conjugations.participle + '</em>' +
      '<span class="pp-en">' + enForms.pp + '</span></div>';
    // Wire the infinitive to speak on tap
    const headerEs = header.querySelector('.es');
    if (headerEs) headerEs.addEventListener('click', () => speakSpanish(conj.conjugations.infinitive));
    tilesEl.appendChild(header);

    for (const t of active) {
      const forms = conj.conjugations[t.key];
      if (!forms) continue;
      const tile = document.createElement('div');
      tile.className = 'tile';
      const head = document.createElement('div');
      head.className = 'tile-head';
      head.innerHTML =
        '<span class="label">' + t.label + '</span>' +
        '<span class="es-name">' + t.es + '</span>';
      tile.appendChild(head);
      // Imperative tiles use 4 pronouns (tú, Ud., nos, Uds.) which
      // map to indices 1..4 of the 5-pronoun pronoun-toggle set.
      const isImp = t.pronouns.length === 4;
      forms.forEach((form, i) => {
        if (conjugateFilter && conjugateFilter.pronounIdx !== undefined) {
          // Pair filter: single-pronoun row only
          if (i !== conjugateFilter.pronounIdx) return;
        } else {
          // Standard or tense-only filter: respect the pronoun-filter toggles
          const toggleIdx = isImp ? i + 1 : i;
          if (!pronounToggles[toggleIdx]) return;
        }
        const row = document.createElement('div');
        row.className = 'row';
        const pron = document.createElement('div');
        pron.className = 'pron';
        pron.textContent = (t.pronouns[i] || '');
        const cell = document.createElement('div');
        cell.className = 'form-cell';
        const esForm = document.createElement('div');
        esForm.className = 'es-form';
        esForm.title = 'Tap to hear';
        esForm.innerHTML = splitWithDash(form, t.key, i);
        esForm.addEventListener('click', () => speakSpanish(form));
        const enForm = document.createElement('div');
        enForm.className = 'en-form';
        enForm.textContent = buildRowEnglish(t.key, i, currentEnglishBase);
        cell.appendChild(esForm);
        cell.appendChild(enForm);
        row.appendChild(pron);
        row.appendChild(cell);
        tile.appendChild(row);
      });
      tilesEl.appendChild(tile);
    }
  }
}

//=================================================================
// HANDLE CONJUGATE
//=================================================================
function handleConjugate(forced) {
  const input = (forced !== undefined ? forced : document.getElementById('verbInput').value);
  const result = document.getElementById('verbResult');

  // First, try to parse as an English pronoun + conjugated verb pair.
  // If it parses cleanly, we conjugate the base verb but show only the
  // tense + pronoun row that the user asked about.
  const pair = parseEnglishPair(input);
  if (pair) {
    const inf = ENGLISH_TO_SPANISH[pair.baseVerb] || null;
    if (inf) {
      conjugateFilter = { tense: pair.tense, pronounIdx: pair.pronounIdx };
      currentEnglishBase = pair.baseVerb;
      currentConjugations = inf.map(v => ({
        infinitive: v,
        conjugations: conjugate(v),
      })).filter(c => c.conjugations);
      const tenseLabel = (TENSES.find(t => t.key === pair.tense) || {}).label || pair.tense;
      result.className = 'verb-result';
      result.innerHTML =
        currentConjugations.map(c => '<strong>' + c.infinitive + '</strong>').join(' &nbsp;·&nbsp; ') +
        '<span class="pill">' + tenseLabel + ' · ' + ['yo','tú','él','nos.','ellos'][pair.pronounIdx] + '</span>';
      try { localStorage.setItem(VERB_KEY, input); } catch (e) {}
      renderToggles();
      renderTiles();
      return;
    }
  }

  // Next, try a bare English conjugated verb (no pronoun) → filter to the
  // matching tense tile and let the pronoun toggles decide which rows show.
  const conjOnly = parseEnglishConjugation(input);
  if (conjOnly) {
    const inf = ENGLISH_TO_SPANISH[conjOnly.baseVerb] || null;
    if (inf) {
      conjugateFilter = { tense: conjOnly.tense };
      currentEnglishBase = conjOnly.baseVerb;
      currentConjugations = inf.map(v => ({
        infinitive: v,
        conjugations: conjugate(v),
      })).filter(c => c.conjugations);
      const tenseLabel = (TENSES.find(t => t.key === conjOnly.tense) || {}).label || conjOnly.tense;
      result.className = 'verb-result';
      result.innerHTML =
        currentConjugations.map(c => '<strong>' + c.infinitive + '</strong>').join(' &nbsp;·&nbsp; ') +
        '<span class="pill">' + tenseLabel + '</span>';
      try { localStorage.setItem(VERB_KEY, input); } catch (e) {}
      renderToggles();
      renderTiles();
      return;
    }
  }

  // Not a pair or conjugation → clear any previous filter and use standard lookup.
  conjugateFilter = null;
  const lookup = lookupVerb(input);

  if (!lookup) {
    if (input.trim()) {
      result.className = 'verb-result warn';
      result.textContent = 'Verb not found. Try an English verb (e.g. "speak") or a Spanish infinitive (e.g. "hablar").';
    } else {
      result.className = 'verb-result';
      result.textContent = '';
      currentEnglishBase = 'be';
    }
    currentConjugations = [];
    renderToggles();
    renderTiles();
    return;
  }

  // Only update English base from English-side lookups; Spanish input
  // keeps whatever English base was last shown.
  if (lookup.type === 'en') currentEnglishBase = lookup.enBase || 'be';
  currentConjugations = lookup.infinitives.map(inf => ({
    infinitive: inf,
    conjugations: conjugate(inf),
  })).filter(c => c.conjugations);

  result.className = 'verb-result';
  if (lookup.type === 'es') {
    if (lookup.infinitives.length === 1) {
      const inf = lookup.infinitives[0];
      result.innerHTML = '<strong>' + inf + '</strong>' +
        (IRREGULARS[inf] ? '<span class="pill">irregular</span>' : '<span class="pill">regular</span>');
    } else {
      result.innerHTML = lookup.infinitives.map(inf => '<strong>' + inf + '</strong>').join(' &nbsp;·&nbsp; ') +
        '<span class="pill">' + lookup.infinitives.length + ' matches</span>';
    }
  } else if (currentConjugations.length === 1) {
    const c = currentConjugations[0];
    const isIrreg = !!IRREGULARS[c.infinitive];
    result.innerHTML = '<strong>' + c.infinitive + '</strong>' +
      (isIrreg ? '<span class="pill">irregular</span>' : '<span class="pill">regular</span>');
  } else {
    result.innerHTML = currentConjugations.map(c =>
      '<strong>' + c.infinitive + '</strong>'
    ).join(' &nbsp;·&nbsp; ') + '<span class="pill">multiple</span>';
  }

  try { localStorage.setItem(VERB_KEY, input); } catch (e) {}
  renderToggles();
  renderTiles();
}

//=================================================================
// EVENTS
//=================================================================
const inputEl = document.getElementById('verbInput');
const clearBtn = document.getElementById('clearBtn');

inputEl.addEventListener('input', (e) => {
  const v = e.target.value;
  clearBtn.classList.toggle('visible', v.length > 0);
  renderSuggestions();
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    // Blur fires the conjugation; the blur listener does the work.
    inputEl.blur();
  }
});
// Run the search when focus leaves the input — tap anywhere outside or
// press Enter and whatever was typed up to that point gets conjugated.
// _chipTapInProgress tells the blur listener to stand down briefly while
// a chip's own click handler runs the search instead (so the chip's
// natural focus-grab can dismiss the Android keyboard without us
// double-conjugating with the user's pre-tap text).
let _chipTapInProgress = false;
inputEl.addEventListener('blur', () => {
  if (_chipTapInProgress) return;
  if (inputEl.value.trim()) {
    handleConjugate();
    renderSuggestions();
  }
});
clearBtn.addEventListener('click', () => {
  inputEl.value = '';
  clearBtn.classList.remove('visible');
  hideAutocomplete();
  document.getElementById('verbResult').textContent = '';
  currentConjugations = [];
  currentEnglishBase = 'be';
  conjugateFilter = null;
  renderToggles();
  renderTiles();
  renderSuggestions();
  inputEl.focus();
});

document.getElementById('toggleAllOn').addEventListener('click', () => {
  TENSES.forEach(t => toggles[t.key] = true);
  saveToggles(toggles); renderToggles(); renderTiles();
});
document.getElementById('toggleAllOff').addEventListener('click', () => {
  TENSES.forEach(t => toggles[t.key] = false);
  saveToggles(toggles); renderToggles(); renderTiles();
});
document.getElementById('presetCore').addEventListener('click', () => {
  TENSES.forEach(t => toggles[t.key] = CORE_TENSES.includes(t.key));
  saveToggles(toggles); renderToggles(); renderTiles();
});
document.getElementById('pronounAllOn').addEventListener('click', () => {
  pronounToggles = [true, true, true, true, true];
  savePronounToggles(pronounToggles); renderPronounToggles(); renderTiles();
});
document.getElementById('pronounAllOff').addEventListener('click', () => {
  pronounToggles = [false, false, false, false, false];
  savePronounToggles(pronounToggles); renderPronounToggles(); renderTiles();
});

// Pronouns card collapse
const pronounsCard = document.getElementById('pronounsCard');
const pronounsHeader = pronounsCard.querySelector('.card-header');
const PRONOUN_COLLAPSE_KEY = 'spanishApp.pronounsCollapsed.v1';
// Pronoun toggles default to collapsed; expand only if user has opened it.
try {
  if (localStorage.getItem(PRONOUN_COLLAPSE_KEY) !== '0') pronounsCard.classList.add('collapsed');
} catch (e) { pronounsCard.classList.add('collapsed'); }
pronounsHeader.addEventListener('click', () => {
  pronounsCard.classList.toggle('collapsed');
  try {
    localStorage.setItem(PRONOUN_COLLAPSE_KEY, pronounsCard.classList.contains('collapsed') ? '1' : '0');
  } catch (e) {}
});

// Keep the input focused when tapping the inline buttons — without this
// the input would blur, fire its blur-search handler with whatever's
// typed, then the button's own click handler would fire (double-work).
['langBtn','micBtn','clearBtn'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('mousedown', (e) => e.preventDefault());
});

// Speech recognition
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const SPEECH_LANG_KEY = 'spanishApp.speechLang.v1';
const langBtn = document.getElementById('langBtn');
const micBtn  = document.getElementById('micBtn');
let speechLang = (function() {
  try { return localStorage.getItem(SPEECH_LANG_KEY) || 'es-ES'; } catch (e) { return 'es-ES'; }
})();
function updateLangBtn() {
  const isEs = speechLang === 'es-ES';
  langBtn.textContent = isEs ? 'ES' : 'EN';
  langBtn.dataset.lang = isEs ? 'es' : 'en';
  langBtn.title = 'Search & speech: ' + (isEs ? 'Spanish' : 'English') + ' — tap to switch';
  if (typeof micBtn !== 'undefined' && micBtn) {
    micBtn.title = 'Speak a verb (' + (isEs ? 'Spanish' : 'English') + ')';
  }
}
updateLangBtn();
langBtn.addEventListener('click', () => {
  speechLang = speechLang === 'en-US' ? 'es-ES' : 'en-US';
  try { localStorage.setItem(SPEECH_LANG_KEY, speechLang); } catch (e) {}
  updateLangBtn();
  // Re-source the search results to the newly active language
  renderSuggestions();
  if (inputEl.value) showAutocomplete(inputEl.value);
});

let activeRecognition = null;
if (!SpeechRec) {
  micBtn.disabled = true;
  micBtn.title = 'Speech recognition not supported in this browser';
}
// Speech recognition language follows the EN/ES toggle: ES → es-ES
// (Spanish recognition), EN → en-US. The Web Speech API can only listen
// in one language at a time, so the toggle is the user-facing switch.
// After recognition, the transcript is still verified against both the
// English dictionary and the Spanish verb list, so spoken English maps
// to its Spanish translation and spoken Spanish conjugates directly.
function pickSpeechLang() {
  if (typeof speechLang !== 'undefined' && speechLang) return speechLang;
  return navigator.language || 'en-US';
}
function verifyAndApplyTranscript(raw) {
  const transcript = (raw || '').toLowerCase().replace(/[.,!?¿¡]/g, '').trim();
  if (!transcript) return;
  const norm = stripAccents(transcript.replace(/^to\s+/, ''));
  // English dictionary lookup (accent-insensitive, exact key match)
  const enKey = Object.keys(ENGLISH_TO_SPANISH).find(k => stripAccents(k) === norm);
  // Spanish verb list lookup
  const esKey = SPANISH_VERB_LIST.find(k => stripAccents(k) === norm);
  // Or any -ar/-er/-ir Spanish-shaped fallback
  const matched = enKey || esKey || (getEnding(norm) ? norm : transcript);
  inputEl.value = matched;
  clearBtn.classList.add('visible');
  handleConjugate(matched);
  renderSuggestions();
}
micBtn.addEventListener('click', () => {
  if (!SpeechRec) return;
  if (activeRecognition) { activeRecognition.stop(); return; }
  const r = new SpeechRec();
  r.lang = pickSpeechLang();
  r.continuous = false;
  r.interimResults = false;
  r.maxAlternatives = 3;
  r.onresult = (event) => {
    // Try each alternative; first one that maps to a known verb wins.
    const alts = event.results[0];
    let chosen = alts[0] && alts[0].transcript || '';
    for (let i = 0; i < alts.length; i++) {
      const t = (alts[i].transcript || '').toLowerCase().replace(/[.,!?¿¡]/g, '').trim();
      const norm = stripAccents(t.replace(/^to\s+/, ''));
      if (Object.keys(ENGLISH_TO_SPANISH).some(k => stripAccents(k) === norm) ||
          SPANISH_VERB_LIST.some(k => stripAccents(k) === norm)) {
        chosen = t;
        break;
      }
    }
    verifyAndApplyTranscript(chosen);
  };
  r.onerror = () => { /* no-op; browser will surface in console */ };
  r.onend = () => {
    activeRecognition = null;
    micBtn.classList.remove('recording');
  };
  try { r.start(); activeRecognition = r; micBtn.classList.add('recording'); }
  catch (e) { activeRecognition = null; micBtn.classList.remove('recording'); }
});

// Collapse toggles card
const togglesCard = document.getElementById('togglesCard');
const togglesHeader = togglesCard.querySelector('.card-header');
// Tense toggles default to collapsed; expand only if the user has explicitly opened it.
try {
  if (localStorage.getItem(COLLAPSE_KEY) !== '0') togglesCard.classList.add('collapsed');
} catch (e) { togglesCard.classList.add('collapsed'); }
togglesHeader.addEventListener('click', () => {
  togglesCard.classList.toggle('collapsed');
  try {
    localStorage.setItem(COLLAPSE_KEY, togglesCard.classList.contains('collapsed') ? '1' : '0');
  } catch (e) {}
});

//=================================================================
// INIT
//=================================================================
renderToggles();
renderPronounToggles();
renderSuggestions();

// Persist all toggle/collapse state on page hide / app backgrounding so a
// closed tab, swipe-killed Android PWA, or a navigation-away never loses
// the user's selections. Each click already calls its save function, but
// this is a belt-and-suspenders flush in case a handler was bypassed.
function persistAllState() {
  try {
    saveToggles(toggles);
    savePronounToggles(pronounToggles);
    saveMoodCollapsed(moodCollapsed);
    localStorage.setItem(COLLAPSE_KEY, togglesCard.classList.contains('collapsed') ? '1' : '0');
    localStorage.setItem(PRONOUN_COLLAPSE_KEY, pronounsCard.classList.contains('collapsed') ? '1' : '0');
    if (typeof speechLang !== 'undefined') localStorage.setItem(SPEECH_LANG_KEY, speechLang);
  } catch (e) {}
}
// pagehide is more reliable than beforeunload on mobile / PWAs.
window.addEventListener('pagehide', persistAllState);
// Also when the tab/PWA goes to background — Android may kill the page later.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) persistAllState();
});

// Default verb: 'be' on every load
inputEl.value = 'be';
clearBtn.classList.add('visible');
handleConjugate('be');

// PWA service worker registration — caches the app shell so it works
// offline after the first load. No-ops on browsers that don't support it.
let _swReg = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try { _swReg = await navigator.serviceWorker.register('service-worker.js'); }
    catch (e) {}
  });
}

//=================================================================
// Version + update chip — pattern lifted from the Offline Audio Player.
// On load we silently fetch version.json from the GitHub repo (no SW
// cache, bypasses HTTP cache) and compare to APP_VERSION below. If
// newer, the header chip turns green and clicking it (or the footer
// button) reloads with a fresh service-worker fetch.
//=================================================================
const APP_VERSION = '1.0.0';
const VERSION_URL = 'https://raw.githubusercontent.com/BizyCapitalyst/spanish-trainer/master/version.json';

const updateChip = document.getElementById('updateChip');
const updateBtn  = document.getElementById('updateBtn');
if (updateChip) updateChip.textContent = 'v' + APP_VERSION;

function compareVersions(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}

async function checkForUpdate(silent) {
  if (!silent && updateBtn) updateBtn.textContent = 'Checking…';
  try {
    const r = await fetch(VERSION_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j && j.version && compareVersions(APP_VERSION, j.version) < 0) {
      if (updateChip) {
        updateChip.textContent = 'update → v' + j.version;
        updateChip.classList.add('has-update');
        updateChip.title = 'Tap to install v' + j.version;
        updateChip.onclick = applyUpdate;
      }
      if (updateBtn) {
        updateBtn.textContent = 'Update to v' + j.version;
        updateBtn.onclick = applyUpdate;
      }
      return j.version;
    }
    if (!silent && updateBtn) updateBtn.textContent = 'Up to date';
  } catch (e) {
    if (!silent && updateBtn) updateBtn.textContent = 'Check failed (offline?)';
  }
  setTimeout(() => {
    if (updateBtn && !(updateChip && updateChip.classList.contains('has-update'))) {
      updateBtn.textContent = 'Check for updates';
    }
  }, 2500);
  return null;
}

async function applyUpdate() {
  if (_swReg) {
    try { await _swReg.update(); } catch (e) {}
  }
  // Force a fresh fetch path — the new SW will take over on next load.
  location.reload();
}

if (updateChip) {
  updateChip.addEventListener('click', () => {
    if (!updateChip.classList.contains('has-update')) checkForUpdate(false);
  });
}
if (updateBtn) {
  updateBtn.addEventListener('click', () => {
    if (updateBtn.textContent.startsWith('Update to')) applyUpdate();
    else checkForUpdate(false);
  });
}
// Silent check on load — only on http(s); file:// can't reach raw.githubusercontent
if (location.protocol.startsWith('http')) {
  setTimeout(() => checkForUpdate(true), 1500);
}
</script>
