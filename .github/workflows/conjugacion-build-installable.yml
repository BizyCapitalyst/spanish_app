name: Build installable Conjugacion Diaria APK

on:
  push:
    branches: [conjugacion-diaria-build-20260809]
    paths:
      - '.github/workflows/conjugacion-build-installable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4
        with:
          ref: conjugacion-diaria-build-20260809

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            conjugacion-build/source.tar.gz.b64.part-000 \
            conjugacion-build/source.tar.gz.b64.part-001a \
            conjugacion-build/source.tar.gz.b64.part-001b \
            conjugacion-build/source.tar.gz.b64.part-001c \
            conjugacion-build/source.tar.gz.b64.part-002 \
            conjugacion-build/source.tar.gz.b64.part-003 \
            conjugacion-build/source.tar.gz.b64.part-004 \
            conjugacion-build/source.tar.gz.b64.part-005 \
            | base64 --decode > work/source.tar.gz
          echo "9e0cd077e8b1d85e08cb2a418f276734bcda3dc432d4580fa6848e8d44b030ba  work/source.tar.gz" | sha256sum -c -
          tar -xzf work/source.tar.gz -C work
          test -f work/conjugacion_diaria/settings.gradle.kts
          python conjugacion-build/apply-generator-fix.py work/conjugacion_diaria
          python conjugacion-build/apply-levantarse-seed-fix.py work/conjugacion_diaria
          python conjugacion-build/apply-kotlin-dsl-fix.py work/conjugacion_diaria
          python conjugacion-build/apply-dependency-compat-fix.py work/conjugacion_diaria
          python conjugacion-build/apply-kotlin-source-compile-fix.py work/conjugacion_diaria
          python conjugacion-build/apply-choice-chips-call-fix.py work/conjugacion_diaria
          python conjugacion-build/apply-viewmodel-setter-clash-fix.py work/conjugacion_diaria
          sed -E -i 's/compileSdk = [0-9]+/compileSdk = 36/' work/conjugacion_diaria/app/build.gradle.kts
          sed -E -i 's/targetSdk = [0-9]+/targetSdk = 36/' work/conjugacion_diaria/app/build.gradle.kts
          grep -q 'compileSdk = 36' work/conjugacion_diaria/app/build.gradle.kts
          grep -q 'targetSdk = 36' work/conjugacion_diaria/app/build.gradle.kts
          grep -q 'JvmTarget.JVM_17' work/conjugacion_diaria/app/build.gradle.kts
          grep -q 'androidx.core:core-ktx:1.17.0' work/conjugacion_diaria/app/build.gradle.kts
          ! grep -q 'applicationIdSuffix' work/conjugacion_diaria/app/build.gradle.kts
          ! grep -R -q '\.weight(' work/conjugacion_diaria/app/src/main/java/com/james/conjugaciondiaria
          ! grep -q 'flatMap { cardsForVerb' work/conjugacion_diaria/app/src/main/java/com/james/conjugaciondiaria/Repository.kt
          test "$(grep -c 'onToggle =' work/conjugacion_diaria/app/src/main/java/com/james/conjugaciondiaria/ManagementScreens.kt)" -ge 7
          grep -q 'fun updateBuilderConfig(config: SessionConfig)' work/conjugacion_diaria/app/src/main/java/com/james/conjugaciondiaria/AppViewModel.kt
          ! grep -R -q 'setBuilderConfig(' work/conjugacion_diaria/app/src/main/java/com/james/conjugaciondiaria
          node --check work/conjugacion_diaria/tools/generate_paradigms.js
          python -m py_compile work/conjugacion_diaria/tools/generate_library.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate and validate verb library
        working-directory: work/conjugacion_diaria
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          python tools/generate_library.py --refresh
          python - <<'PY'
          import json
          report = json.load(open('data/library_validation.json', encoding='utf-8'))
          assert report['passed']
          assert report['verbCount'] >= 2000
          assert report['duplicateCount'] == 0
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Create Gradle wrapper
        working-directory: work/conjugacion_diaria
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Build signed installable APK
        working-directory: work/conjugacion_diaria
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="work/conjugacion_diaria/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" deliverables/Conjugacion-Diaria-1.0.0.apk
          "$BT/zipalign" -c -P 16 -v 4 deliverables/Conjugacion-Diaria-1.0.0.apk
          "$BT/apksigner" verify --verbose --print-certs deliverables/Conjugacion-Diaria-1.0.0.apk
          "$BT/aapt" dump badging deliverables/Conjugacion-Diaria-1.0.0.apk | tee deliverables/apk-badging.txt
          grep -q "package: name='com.james.conjugaciondiaria' versionCode='1' versionName='1.0.0'" deliverables/apk-badging.txt
          grep -q "sdkVersion:'26'" deliverables/apk-badging.txt
          grep -q "targetSdkVersion:'36'" deliverables/apk-badging.txt
          sha256sum deliverables/Conjugacion-Diaria-1.0.0.apk | tee deliverables/Conjugacion-Diaria-1.0.0.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: conjugacion-diaria-installable-apk
          path: |
            deliverables/Conjugacion-Diaria-1.0.0.apk
            deliverables/Conjugacion-Diaria-1.0.0.apk.sha256
            deliverables/apk-badging.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run available JVM unit tests
        continue-on-error: true
        working-directory: work/conjugacion_diaria
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest
