name: Build Grammar Tutor APK

on:
  push:
    branches: [ grammar-tutor-build ]
    paths:
      - 'android_grammar_tutor/**'
      - 'scripts/android-verify-apk.sh'
      - 'scripts/android-emulator-smoke-test.sh'
      - '.github/workflows/build-grammar-tutor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply source compatibility fix
        run: sed -i 's/b.setTextAllCaps(false); //g' android_grammar_tutor/app/src/main/java/com/james/gramaticaconversacional/MainActivity.java

      - name: Build debug APK
        working-directory: android_grammar_tutor
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify exact APK
        run: bash scripts/android-verify-apk.sh android_grammar_tutor/app/build/outputs/apk/debug/app-debug.apk com.james.gramaticaconversacional com.james.gramaticaconversacional.MainActivity 35.0.0

      - name: Fresh-install and relaunch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-emulator-smoke-test.sh android_grammar_tutor/app/build/outputs/apk/debug/app-debug.apk com.james.gramaticaconversacional .MainActivity 7

      - name: Rename exact passing APK
        run: cp android_grammar_tutor/app/build/outputs/apk/debug/app-debug.apk "Gramatica Conversacional 2.0.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Gramatica-Conversacional-2.0.0
          path: Gramatica Conversacional 2.0.0.apk
          if-no-files-found: error
