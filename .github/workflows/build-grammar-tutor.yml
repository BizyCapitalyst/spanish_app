name: Build Grammar Tutor APK

on:
  push:
    branches: [ grammar-tutor-build ]
    paths:
      - 'android_grammar_tutor/**'
      - '.github/workflows/build-grammar-tutor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply source compatibility fix
        run: sed -i 's/b.setTextAllCaps(false); //g' android_grammar_tutor/app/src/main/java/com/james/gramaticaconversacional/MainActivity.java
      - name: Build debug APK
        working-directory: android_grammar_tutor
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK package
        run: |
          APK=android_grammar_tutor/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -20
      - name: Emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android_grammar_tutor/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.james.gramaticaconversacional/.MainActivity
            sleep 5
            PID=$(adb shell pidof com.james.gramaticaconversacional | tr -d '\r')
            test -n "$PID"
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|Process: com.james.gramaticaconversacional' ; then
              exit 1
            fi
            echo "Launch smoke test PASS; pid=$PID"
      - name: Rename APK
        run: cp android_grammar_tutor/app/build/outputs/apk/debug/app-debug.apk "Gramatica Conversacional 2.0.0.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Gramatica-Conversacional-2.0.0
          path: Gramatica Conversacional 2.0.0.apk
          if-no-files-found: error
