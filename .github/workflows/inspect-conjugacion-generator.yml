name: Inspect Conjugacion Diaria Kotlin sources

on:
  push:
    branches: [conjugacion-diaria-build-20260809]
    paths:
      - '.github/workflows/inspect-conjugacion-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conjugacion-diaria-build-20260809
      - name: Reconstruct and print Kotlin error context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            conjugacion-build/source.tar.gz.b64.part-000 \
            conjugacion-build/source.tar.gz.b64.part-001a \
            conjugacion-build/source.tar.gz.b64.part-001b \
            conjugacion-build/source.tar.gz.b64.part-001c \
            conjugacion-build/source.tar.gz.b64.part-002 \
            conjugacion-build/source.tar.gz.b64.part-003 \
            conjugacion-build/source.tar.gz.b64.part-004 \
            conjugacion-build/source.tar.gz.b64.part-005 \
            | base64 --decode > work/source.tar.gz
          tar -xzf work/source.tar.gz -C work
          SRC=work/conjugacion_diaria/app/src/main/java/com/james/conjugaciondiaria
          echo '--- HomeBuilderScreens.kt 1-80 ---'
          nl -ba "$SRC/HomeBuilderScreens.kt" | sed -n '1,80p'
          echo '--- PracticeScreen.kt 1-90 ---'
          nl -ba "$SRC/PracticeScreen.kt" | sed -n '1,90p'
          echo '--- ManagementScreens.kt 1-470 ---'
          nl -ba "$SRC/ManagementScreens.kt" | sed -n '1,470p'
          echo '--- Repository.kt 150-235 ---'
          nl -ba "$SRC/Repository.kt" | sed -n '150,235p'
          echo '--- Relevant helper declarations ---'
          grep -R -n -E 'fun .*Chip|fun .*Toggle|onToggle|FilterChip|ChoiceChip|ToggleChip|SelectableChip' "$SRC" || true
