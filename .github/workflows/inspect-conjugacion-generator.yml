name: Inspect Conjugacion Diaria build script

on:
  push:
    branches: [conjugacion-diaria-build-20260809]
    paths:
      - '.github/workflows/inspect-conjugacion-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conjugacion-diaria-build-20260809
      - name: Reconstruct and print build script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            conjugacion-build/source.tar.gz.b64.part-000 \
            conjugacion-build/source.tar.gz.b64.part-001a \
            conjugacion-build/source.tar.gz.b64.part-001b \
            conjugacion-build/source.tar.gz.b64.part-001c \
            conjugacion-build/source.tar.gz.b64.part-002 \
            conjugacion-build/source.tar.gz.b64.part-003 \
            conjugacion-build/source.tar.gz.b64.part-004 \
            conjugacion-build/source.tar.gz.b64.part-005 \
            | base64 --decode > work/source.tar.gz
          tar -xzf work/source.tar.gz -C work
          echo '--- app/build.gradle.kts ---'
          nl -ba work/conjugacion_diaria/app/build.gradle.kts
          echo '--- root build.gradle.kts ---'
          nl -ba work/conjugacion_diaria/build.gradle.kts
          echo '--- gradle properties and versions ---'
          cat work/conjugacion_diaria/gradle.properties || true
          find work/conjugacion_diaria/gradle -maxdepth 2 -type f -print -exec cat {} \; 2>/dev/null || true
