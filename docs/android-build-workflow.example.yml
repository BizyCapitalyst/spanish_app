# TEMPLATE — copy to .github/workflows/<app>-android.yml and edit only the APP_* values.
# Do not run this example file directly.

name: Build and Validate Android APK

on:
  workflow_dispatch:

# EDIT THESE VALUES FOR THE APP.
env:
  APP_DIR: android_app
  APP_ID: com.example.app
  APP_ACTIVITY: .MainActivity
  APK_SOURCE: android_app/app/build/outputs/apk/debug/app-debug.apk
  APK_OUTPUT: Example App.apk
  ARTIFACT_NAME: Example-App
  BUILD_TOOLS_VERSION: 35.0.0

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frozen Android platform/build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK package and launcher
        run: bash scripts/android-verify-apk.sh "$APK_SOURCE" "$APP_ID" "$APP_ID${APP_ACTIVITY}" "$BUILD_TOOLS_VERSION"

      # Emulator compute is intentionally used only after compilation and static package verification pass.
      - name: Fresh-install and runtime survival test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-emulator-smoke-test.sh "$APK_SOURCE" "$APP_ID" "$APP_ACTIVITY" 7

      - name: Rename exact passing APK
        run: cp "$APK_SOURCE" "$APK_OUTPUT"

      - name: Record SHA-256
        run: sha256sum "$APK_OUTPUT"

      - name: Upload exact passing APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_OUTPUT }}
          if-no-files-found: error
